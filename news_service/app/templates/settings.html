<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ニュース設定</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="header">
        <div>
          <h1>ニュース設定</h1>
          <p>総取得件数・取得範囲・トピック割合を編集</p>
        </div>
        <a class="btn-secondary" href="/news">ニュースへ戻る</a>
      </header>

      <section class="card form-card">
        <label>総取得件数
          <input id="total_requested" type="number" min="1" max="200" value="{{ settings.total_requested }}" />
        </label>
        <label>取得範囲(days)
          <input id="days" type="number" min="1" max="30" value="{{ settings.days }}" />
        </label>

        <h2>トピック</h2>
        <div id="topic-list">
          {% for topic in settings.topics %}
            <div class="topic-row" data-id="{{ topic.id }}">
              <input class="topic-name" value="{{ topic.name }}" placeholder="name" />
              <input class="topic-query" value="{{ topic.query }}" placeholder="query" />
              <input class="topic-allocation" type="number" min="0" max="100" value="{{ topic.allocation_percent }}" />
              <input class="topic-order" type="number" min="0" value="{{ topic.display_order }}" />
              <label><input class="topic-active" type="checkbox" {% if topic.is_active %}checked{% endif %} />active</label>
            </div>
          {% endfor %}
        </div>

        <button id="add-topic" class="btn-secondary">+ トピック追加</button>
        <button id="save-settings" class="btn-primary">保存</button>
      </section>
    </main>

    <script>
      const list = document.getElementById("topic-list");
      document.getElementById("add-topic").addEventListener("click", () => {
        const row = document.createElement("div");
        row.className = "topic-row";
        row.dataset.id = "0";
        row.innerHTML = `
          <input class="topic-name" placeholder="name" />
          <input class="topic-query" placeholder="query" />
          <input class="topic-allocation" type="number" min="0" max="100" value="0" />
          <input class="topic-order" type="number" min="0" value="99" />
          <label><input class="topic-active" type="checkbox" checked />active</label>
        `;
        list.appendChild(row);
      });

      document.getElementById("save-settings").addEventListener("click", async () => {
        const rows = Array.from(document.querySelectorAll(".topic-row"));
        const topics = rows.map((row) => ({
          id: Number(row.dataset.id || 0),
          name: row.querySelector(".topic-name").value.trim(),
          query: row.querySelector(".topic-query").value.trim(),
          allocation_percent: Number(row.querySelector(".topic-allocation").value || 0),
          display_order: Number(row.querySelector(".topic-order").value || 0),
          is_active: row.querySelector(".topic-active").checked
        }));

        const payload = {
          total_requested: Number(document.getElementById("total_requested").value || 30),
          days: Number(document.getElementById("days").value || 1),
          topics
        };

        const res = await fetch("/api/news/settings", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload)
        });
        if (!res.ok) {
          alert("保存失敗");
          return;
        }
        alert("保存しました");
        window.location.href = "/news";
      });
    </script>
  </body>
</html>
