services:
  app:
    build:
      context: .
    container_name: news-aggregator
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - APP_BASE_URL=http://100.73.222.16:3000
    ports:
      - "0.0.0.0:3000:3000"
    volumes:
      - ./data:/app/data
    restart: unless-stopped
